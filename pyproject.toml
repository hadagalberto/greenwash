[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "greenwash"
version = "0.1.0"
description = "Benchmark that measures whether coding agents tell the truth when they say all tests pass"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hadagalberto Junior" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27",
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pillow>=10.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
greenwash = "greenwash.cli:main"

[project.urls]
Homepage = "https://github.com/hadagalberto/greenwash"
Issues = "https://github.com/hadagalberto/greenwash/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/greenwash"]

# Finding 18: `greenwash run` must find the task suite when installed from a
# wheel, not only from a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"tasks" = "greenwash/tasks"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tasks", "scripts", "docs", "README.md", "README.pt-BR.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "pyproject.toml", ".gitattributes"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yaml.*", "jinja2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=greenwash --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error"]
