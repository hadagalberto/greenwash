name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: harness (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Build package
        run: python -m pip wheel . --no-deps -w dist/
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Types
        run: python -m mypy --strict
      - name: Tests
        run: python -m pytest

  validate-tasks:
    name: validate-tasks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate every task
        run: python -m greenwash validate-tasks --tasks tasks
